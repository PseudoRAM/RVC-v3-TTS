image: "r8.im/pseudoram/tts-rvc"
build:
  gpu: true
  cuda: "12.4"
  python_version: "3.10"
  python_requirements: requirements.txt
  system_packages:
    - ffmpeg
    - libsndfile1
    - sox
    - espeak-ng
    - python3-venv
  run:
    # Emotion engine stays isolated from both Kokoro and legacy RVC dependencies.
    # Run scripts/download_expressive.py locally before building so weights are included.
    - python -m venv /opt/expressive
    - /opt/expressive/bin/python -m pip install pip==25.3
    - --mount=type=cache,target=/root/.cache/pip /opt/expressive/bin/python -m pip install --timeout 180 torch==2.6.0+cu124 torchaudio==2.6.0+cu124 --extra-index-url https://download.pytorch.org/whl/cu124
    - --mount=type=cache,target=/root/.cache/pip /opt/expressive/bin/python -m pip install --timeout 180 qwen-tts==0.1.1
    - python -m venv /opt/rvc
    - /opt/rvc/bin/python -m pip install pip==24.0 setuptools==69.5.1 wheel==0.43.0
    # Cog build commands cannot read project files. Keep pins aligned with requirements-rvc.txt.
    - --mount=type=cache,target=/root/.cache/pip /opt/rvc/bin/python -m pip install --timeout 180 --extra-index-url https://download.pytorch.org/whl/cu118 torch==2.0.1+cu118 torchaudio==2.0.2+cu118 faiss-cpu==1.7.3 ffmpeg-python==0.2.0 librosa==0.9.1 numpy==1.26.4 numba==0.59.1 llvmlite==0.42.0 praat-parselmouth==0.4.3 pyworld==0.3.4 scipy==1.13.1 soundfile==0.12.1 torchcrepe==0.0.20 tqdm==4.65.0 fairseq==0.12.2
predict: "predict.py:Predictor"
